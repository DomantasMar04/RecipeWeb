<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Registracija</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
    <a class="nav-brand" href="/index.html">🍴 Receptai</a>
    <div class="nav-links">
        <a href="/login.html">Prisijungti</a>
    </div>
</nav>

<div class="page-narrow">
    <div class="auth-card">
        <h2>Registracija</h2>

        <div class="field">
            <label>Slapyvardis</label>
            <input id="username" placeholder="jusu_vardas">
        </div>

        <div class="field">
            <label>El. paštas</label>
            <input id="email" placeholder="jusu@pastas.lt">
        </div>

        <div class="field">
            <label>Slaptažodis</label>
            <input id="password" type="password" placeholder="••••••••">
        </div>

        <button class="btn btn-primary" onclick="signup()">Registruotis</button>

        <p id="msg"></p>

        <div class="auth-footer">
            Jau turite paskyrą? <a href="/login.html">Prisijungti</a>
        </div>
    </div>
</div>

<script src="/app.js"></script>
</body>
</html>

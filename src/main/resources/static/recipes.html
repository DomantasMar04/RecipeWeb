<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Receptai</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
    <a class="nav-brand" href="/index.html">🍴 Receptai</a>
    <div class="nav-links">
        <a href="/profile.html">Mano profilis</a>
        <button onclick="logout()">Atsijungti</button>
    </div>
</nav>

<div class="page">
    <div class="recipes-layout">

        <!-- LEFT SIDE -->
        <div class="add-recipe-panel">
            <h2>Redaguoti receptą</h2>

            <div class="field">
                <label>Pavadinimas</label>
                <input id="title" placeholder="Pasirinkite receptą redagavimui...">
            </div>

            <div class="form-row">
                <div class="field">
                    <label>Kategorija</label>
                    <input id="category" placeholder="pvz. Pietūs">
                </div>

                <div class="field">
                    <label>Gaminimo laikas (min)</label>
                    <input id="time" type="number" placeholder="60">
                </div>
            </div>

            <div class="field">
                <label>Aprašymas</label>
                <textarea id="description" placeholder="Trumpai aprašykite receptą..."></textarea>
            </div>

            <button class="btn btn-primary" id="submitBtn" style="width:auto;" onclick="updateRecipe()">
                Atnaujinti receptą
            </button>
        </div>

        <!-- RIGHT SIDE -->
        <div class="recipes-content">
            <div class="section-header">
                <h2 style="margin:0;">Visi receptai</h2>
                <button class="btn btn-outline btn-sm" onclick="loadRecipes()">
                    ↻ Atnaujinti
                </button>
            </div>

            <div class="recipe-grid" id="list"></div>
        </div>

    </div>
</div>

<script src="/app.js"></script>
</body>
</html>
